<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Little Warrior — Leaderboard</title>
  <style>
    body {
      margin: 0;
      background: #222;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    main {
      width: 560px;
      max-width: 92vw;
      padding: 40px 0 60px;
    }

    h1 {
      text-align: center;
      margin: 0 0 4px;
    }

    .sub {
      text-align: center;
      color: #aaa;
      margin: 0 0 24px;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #2c2c2c;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
    }

    th {
      background: #333;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #bbb;
    }

    tr:nth-child(even) td { background: #292929; }

    .rank { width: 48px; color: #888; }
    .score { text-align: right; font-weight: bold; }
    th.score { text-align: right; }

    .top-1 .rank { color: #ffd700; }
    .top-2 .rank { color: #c0c0c0; }
    .top-3 .rank { color: #cd7f32; }

    #status {
      text-align: center;
      color: #aaa;
      padding: 24px;
    }

    .actions {
      text-align: center;
      margin-top: 24px;
    }

    .btn {
      display: inline-block;
      font-size: 16px;
      padding: 10px 22px;
      border: none;
      border-radius: 6px;
      background: #4caf50;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
    }

    .btn:hover { background: #43a047; }
  </style>
</head>
<body>
<main>
  <h1>Leaderboard</h1>
  <p class="sub">Top Little Warriors</p>

  <div id="status">Loading…</div>
  <table id="board" style="display:none">
    <thead>
      <tr>
        <th class="rank">#</th>
        <th>Name</th>
        <th class="score">Score</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="actions">
    <a class="btn" href="./index.html">Play</a>
  </div>
</main>

<script type="module" src="./js/leaderboardPage.js"></script>
</body>
</html>
