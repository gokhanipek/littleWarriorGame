<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>2D Prototype MVP with Animated Character</title>
  <style>
    canvas {
      position: fixed;
      left: 50%;
      top: 50%;
      margin-left: -400px;
      margin-top: -200px;
      background: #87CEEB; /* sky blue */
      display: block;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
<canvas id="game" width="800" height="400"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Player
let player = {
  x: 250,
  y: 300,
  w: 32,
  h: 32,
  dx: 0,
  dy: 0,
  walkSpeed: 2,
  runSpeed: 5,
  slowSpeed: 1.2,
  jumpPower: -5,
  onGround: false,
  direction: "right",
  speed: 2
};

const gravity = 0.4;
const ground = 350;
const mapStart = 200;
const mapEnd = 5000;
const waterWidth = 200;

let keys = {};
let cameraX = 0;
let targetCameraX = 0;

// Stamina
let stamina = 300;
const maxStamina = 300;
const staminaRegen = 0.1;
const runDrain = 0;
const jumpDrain = 10;

// sky gradient colors
const dayTop = "#87CEEB";   // light sky blue
const dayBottom = "#E0F6FF"; // very light blue
const nightTop = "#0B0033"; // dark blue
const nightBottom = "#1A1A40"; // darker purple-blue


// Images
const characterImg = new Image();
characterImg.src = "./images/littleWarrior.png";

const treeImg = new Image();
treeImg.src = "./images/tree-trunk.png";

const treeLeavesImg = new Image();
treeLeavesImg.src = "./images/tree-leaves.png";

const fruitImg = new Image();
fruitImg.src = "./images/fruit.png";

const plantImg = new Image();
plantImg.src = "./images/plant.png";

// Sprite sheet info
const frameWidth = 144 / 8; // 18 px but use int for clean scaling
const frameHeight = 18;
let frameIndex = 0;
let frameTimer = 0;
const frameInterval = 200; // ms
let animationState = "idle";

// Trees and plants
let trees = [];
let plants = [];
let numberOfTrees = Math.floor(Math.random() * 50) + 20;
let numberOfPlants = Math.floor(Math.random() * 80) + 20;
let collectedFruits = 0;
let collectedPlants = 0;

const cycleDuration = 60000; // 1 minute in ms
function getCycleProgress() {
  const now = Date.now();
  return (now % cycleDuration) / cycleDuration; // 0 → 1
}

function lerpColor(a, b, t) {
  const ah = parseInt(a.replace(/#/g, ''), 16),
        ar = ah >> 16, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
  const bh = parseInt(b.replace(/#/g, ''), 16),
        br = bh >> 16, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
  const rr = ar + t * (br - ar);
  const rg = ag + t * (bg - ag);
  const rb = ab + t * (bb - ab);
  return `rgb(${rr|0},${rg|0},${rb|0})`;
}

function getDayNightPhase() {
  const cycleDuration = 60000; // 1 minute
  const now = Date.now();
  const progress = (now % cycleDuration) / cycleDuration; // 0 → 1
  return progress; 
}




// Generate random trees with fruits
for (let i = 0; i < numberOfTrees; i++) {
  let treeX = Math.round(Math.random() * (mapEnd - mapStart - waterWidth)) + mapStart;
  let fruits = [];
  let fruitCount = Math.floor(Math.random() * 3) + 1;
  for (let j = 0; j < fruitCount; j++) {
    fruits.push({
      x: treeX + (Math.random() * 40 - 20),
      offsetY: 10 + Math.random() * (76 - 16 - 10),
      collected: false,
      respawnTime: 0
    });
  }
  trees.push({ x: treeX, y: 260, fruits });
}

// Generate random plants
for (let i = 0; i < numberOfPlants; i++) {
  let plantX = Math.round(Math.random() * (mapEnd - mapStart - waterWidth)) + mapStart;
  plants.push({
    x: plantX,
    y: 325,
    collected: false,
    respawnTime: 0
  });
}

document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

function update(deltaTime) {
  if (!keys["ShiftLeft"] && player.onGround) stamina = Math.min(maxStamina, stamina + staminaRegen);

  if (stamina <= 20) player.speed = player.slowSpeed;
  else if (keys["ShiftLeft"]) { player.speed = player.runSpeed; stamina -= runDrain; }
  else player.speed = player.walkSpeed;

  if (keys["ArrowRight"]) { player.x += player.speed; player.direction = "right"; }
  if (keys["ArrowLeft"]) { player.x -= player.speed; player.direction = "left"; }

  if (keys["Space"] && player.onGround && stamina > 20) {
    player.dy = player.jumpPower;
    player.onGround = false;
    stamina = Math.max(0, stamina - jumpDrain);
  }

  player.y += player.dy;
  player.dy += gravity;
  if (player.y + player.h >= ground) { player.y = ground - player.h; player.dy = 0; player.onGround = true; }

  if (player.x < mapStart) player.x = mapStart;
  if (player.x + player.w > mapEnd - waterWidth) player.x = mapEnd - waterWidth - player.w;

  if (player.direction === "right") targetCameraX = player.x - canvas.width * 0.15;
  else targetCameraX = player.x - canvas.width * 0.85;
  targetCameraX = Math.max(mapStart - waterWidth, Math.min(mapEnd - canvas.width, targetCameraX));
  cameraX += (targetCameraX - cameraX) * 0.05;

  let now = Date.now();

  // Fruit collection
  trees.forEach(tree => {
    const leavesHeight = 76;
    const leavesY = tree.y - leavesHeight / 4;

    tree.fruits.forEach(fruit => {
      const fruitY = leavesY + fruit.offsetY;
      const fruitX = fruit.x;

      if (!fruit.collected &&
          Math.abs(player.x - fruitX) < 20 &&
          Math.abs(player.y - fruitY) < 40) {
        fruit.collected = true;
        fruit.respawnTime = now + 30000;
        collectedFruits++;
      } else if (fruit.collected && now > fruit.respawnTime) {
        fruit.collected = false;
      }
    });
  });

  // Plant collection
  plants.forEach(plant => {
    if (!plant.collected && Math.abs(player.x - plant.x) < 20 && player.onGround) {
      plant.collected = true;
      plant.respawnTime = now + 30000;
      collectedPlants++;
    } else if (plant.collected && now > plant.respawnTime) plant.collected = false;
  });

  // Animation state
  if (keys["ArrowRight"]) animationState = "right";
  else if (keys["ArrowLeft"]) animationState = "left";
  else animationState = "idle";

  // Frame update
  frameTimer += deltaTime;
  if (frameTimer > frameInterval) {
    frameTimer = 0;
    frameIndex = (frameIndex + 1) % 2; // cycle 2 frames per state
  }
}

function drawBackground() {
  const phase = getDayNightPhase();
  let t = phase < 0.5 ? phase * 2 : (1 - phase) * 2; // 0 → 1 → 0

  // Gradient colors
  const topColor = lerpColor("#87CEEB", "#0B0033", t);   // sky
  const bottomColor = lerpColor("#E0F6FF", "#1A1A40", t); // horizon

  const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, topColor);
  gradient.addColorStop(1, bottomColor);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // ☀️/🌙 Sun & Moon
  const sunColor = t < 0.5 ? "yellow" : "white"; 
  ctx.fillStyle = sunColor;
  ctx.beginPath();
  ctx.arc(700 - cameraX * 0.1, 80, 40, 0, Math.PI * 2);
  ctx.fill();

  // ☁️ Clouds
  const cloudColor = t < 0.5 ? "white" : "gray";
  ctx.fillStyle = cloudColor;
  ctx.beginPath();
  ctx.arc(200 - cameraX * 0.1, 100, 30, 0, Math.PI * 2);
  ctx.arc(230 - cameraX * 0.1, 100, 25, 0, Math.PI * 2);
  ctx.arc(170 - cameraX * 0.1, 100, 25, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(600 - cameraX * 0.1, 80, 30, 0, Math.PI * 2);
  ctx.arc(630 - cameraX * 0.1, 80, 25, 0, Math.PI * 2);
  ctx.arc(570 - cameraX * 0.1, 80, 25, 0, Math.PI * 2);
  ctx.fill();

  // Mountains (stay same always)
  ctx.fillStyle = "#556B2F";
  ctx.beginPath();
  ctx.moveTo(-200 - cameraX * 0.3, ground);
  ctx.lineTo(100 - cameraX * 0.3, 150);
  ctx.lineTo(400 - cameraX * 0.3, ground);
  ctx.fill();

  ctx.fillStyle = "#6B8E23";
  ctx.beginPath();
  ctx.moveTo(200 - cameraX * 0.3, ground);
  ctx.lineTo(500 - cameraX * 0.3, 120);
  ctx.lineTo(800 - cameraX * 0.3, ground);
  ctx.fill();
}

function drawPlayer() {
  let spriteX;
  if (animationState === "idle") spriteX = frameIndex * frameWidth; // frames 0–1
  else if (animationState === "right") spriteX = (2 + frameIndex) * frameWidth; // frames 2–3
  else if (animationState === "left") spriteX = (6 + frameIndex) * frameWidth;  // frames 6–7
  else spriteX = 0;

  ctx.drawImage(
    characterImg,
    spriteX, 0, frameWidth, frameHeight,
    player.x - cameraX, player.y + 5,
    player.w, player.h
  );
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBackground();

  ctx.fillStyle = "#1E90FF";
  ctx.fillRect(0 - cameraX, ground + 10, waterWidth, 40);
  ctx.fillStyle = "#228822";
  ctx.fillRect(waterWidth - cameraX, ground, mapEnd - mapStart - waterWidth, 50);
  ctx.fillStyle = "#1E90FF";
  ctx.fillRect(mapEnd - waterWidth - cameraX, ground + 10, waterWidth, 40);

  // Trees
  trees.forEach(tree => {
    let screenX = tree.x - cameraX;

    const trunkWidth = 25;
    const trunkHeight = 60;
    ctx.drawImage(treeImg, screenX, tree.y + 40, trunkWidth, trunkHeight);

    const leavesWidth = 58;
    const leavesHeight = 76;
    const leavesX = screenX - (leavesWidth / 2 - trunkWidth / 2);
    const leavesY = tree.y - leavesHeight / 4;
    ctx.drawImage(treeLeavesImg, leavesX, leavesY, leavesWidth, leavesHeight);

    const fruitWidth = 16;
    const fruitHeight = 16;
    tree.fruits.forEach(fruit => {
      if (!fruit.collected) {
        const fruitX = fruit.x - cameraX;
        const fruitY = leavesY + fruit.offsetY;
        ctx.drawImage(fruitImg, fruitX, fruitY, fruitWidth, fruitHeight);
      }
    });
  });

  // Plants
  plants.forEach(plant => {
    let screenX = plant.x - cameraX;
    const plantScale = 0.4;
    const plantWidth = 79 * plantScale;
    const plantHeight = 83 * plantScale;
    if (!plant.collected) ctx.drawImage(plantImg, screenX, plant.y, plantWidth, plantHeight);
    else ctx.drawImage(plantImg, screenX, plant.y + plantHeight * 0.5, plantWidth, plantHeight * 0.25);
  });

  drawPlayer();

  // UI
  ctx.fillStyle = "black";
  ctx.font = "16px Arial";
  ctx.fillText("Fruits: " + collectedFruits, 10, 20);
  ctx.fillText("Plants: " + collectedPlants, 10, 40);
  ctx.fillText("Stamina:", 10, 60);
  ctx.fillStyle = "red";
  ctx.fillRect(80, 50, 300, 10);
  ctx.fillStyle = "limegreen";
  ctx.fillRect(80, 50, stamina, 10);
}

let lastTime = 0;
function loop(timestamp) {
  const deltaTime = timestamp - lastTime;
  lastTime = timestamp;

  update(deltaTime);
  draw();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
